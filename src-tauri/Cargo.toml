[package]
name = "deckchek"
version = "0.0.2"
description = "DJ hardware diagnostic workstation"
authors = ["Circuit Drift Labs"]
edition = "2021"

[lib]
name = "deckchek_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
cpal = "0.16"
rtrb = "0.3"
tauri = { version = "2", features = [] }
midir = "0.10"
