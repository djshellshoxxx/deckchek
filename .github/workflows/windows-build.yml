name: Windows Build

on:
  push:
    branches:
      - main
    tags:
      - v*
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Create a beta pre-release with this tag (e.g. v0.01-beta); leave empty for artifacts only'
        required: false
        default: ''

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri CLI
        uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli

      - name: Build Tauri app
        run: cargo tauri build
        working-directory: .

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deckchek-windows
          path: |
            src-tauri/target/release/deckchek.exe
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: DeckChek Beta Demo ${{ inputs.release_tag || github.ref_name }}
          prerelease: true
          body: |
            DeckChek beta demo for Windows 10/11 (x64).

            - `deckchek.exe`: standalone portable app, no install needed (requires the WebView2 runtime, preinstalled on Windows 10/11).
            - `DeckChek_*_x64-setup.exe`: installer (recommended).
            - `DeckChek_*_x64_en-US.msi`: MSI installer.

            Beta: measurements are not yet validated against reference hardware. The binaries are unsigned, so Windows SmartScreen may warn: click "More info" then "Run anyway".
          files: |
            src-tauri/target/release/deckchek.exe
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
