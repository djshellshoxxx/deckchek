name: DeckChek tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  javascript-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: node --check app/app.js
      - run: node --check app/core.js
      - run: node --check app/advanced.js
